<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RECAMP — Observatory</title>
  <meta name="description" content="RECAMP · The Physical Science Forum · School of Sciences, Jain (Deemed-to-be University), Bengaluru. Internal workspace and archive.">
  <meta name="recamp-build" content="2026-09-04 · 9ebc5f1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,400;0,450;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/celestial.css">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var s = JSON.parse(localStorage.getItem('recamp.workspace.v1') || 'null');
      var t = s && s.settings && s.settings.theme;
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="shell" data-sidebar="open">
    <noscript>
      <div style="padding:2rem;font-family:serif;max-width:40rem">
        <h1 style="font-weight:400">RECAMP</h1>
        <p>The Physical Science Forum — workspace. This application needs JavaScript.</p>
      </div>
    </noscript>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
